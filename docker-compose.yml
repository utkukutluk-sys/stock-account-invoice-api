# StockAccountApp full stack (CONTRACT §8.2/§8.3). Copy .env.example to .env first:  docker compose up --build -d
# Host ports: API 5080, ui-vue 5173, ui-nuxt 3000, SQL Server 14333, Redis 6379
# (stop a local dev Redis container such as "sa-redis" first, it also binds 6379).
name: stockaccount

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "14333:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/StockAccount.Api/Dockerfile
    image: stockaccount-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Server=mssql,1433;Database=StockAccountDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      ConnectionStrings__Redis: redis:6379,abortConnect=false,connectTimeout=2000
      Jwt__Key: ${JWT_KEY}
      Database__MigrateOnStartup: "true"
      Database__Seed: "true"
    ports:
      - "5080:8080"
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ui-vue:
    build:
      context: ./ui-vue
    image: stockaccount-ui-vue
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  ui-nuxt:
    build:
      context: ./ui-nuxt
    image: stockaccount-ui-nuxt
    environment:
      NUXT_API_BASE: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mssql-data:
