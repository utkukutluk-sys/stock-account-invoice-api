# StockAccountApp full stack (CONTRACT §8.2/§8.3).
# First run: ./scripts/deploy/new-secrets.ps1 (creates .env with strong secrets), then
#   docker compose up --build -d            (local, images tagged :local)
#   ./scripts/deploy/deploy.ps1 -Version 1.2.0   (versioned deploy with pre-deploy backup + auto rollback)
# Missing JWT_KEY / MSSQL_SA_PASSWORD make "docker compose" fail immediately.
# Host ports: ui-vue 5173, ui-nuxt 3000 (public entry points); API 5080, SQL Server 14333, Redis 6379 are bound to
# 127.0.0.1 only (local tools/Swagger/newman). Production: set API_BIND= nothing public, or drop the mapping entirely —
# browsers reach the API through the UI proxies on the internal network.
# Networks: "default" (edge) = api + ui proxies with FIXED proxy IPs; "backend" = mssql, redis, db-migrate, api.
# The API trusts X-Forwarded-For only from 172.30.0.10 (ui-vue) and 172.30.0.11 (ui-nuxt) (BUG-7).
# (stop a local dev Redis container such as "sa-redis" first, it also binds 6379).
name: stockaccount

services:
  mssql:
    # Pinned: SQL Server 2022 16.0.4305.5 (tag kept for readability, the digest is what is pulled).
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required - run scripts/deploy/new-secrets.ps1}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:14333:1433"
    networks: [backend]
    volumes:
      - mssql-data:/var/opt/mssql
      # Backups written by scripts/db/backup.ps1 -Target docker land in ./backups on the host.
      - ./backups:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    # Pinned: Redis 7.4.11 (alpine).
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    ports:
      - "127.0.0.1:6379:6379"
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot privileged init step (sa): schema guard + EF migrations + AUTO_CLOSE OFF + RECOVERY SIMPLE + the
  # least-privilege app login/user. Runs on every "up"; the api starts only after it completed successfully.
  db-migrate:
    build:
      context: .
      dockerfile: src/StockAccount.Api/Dockerfile
    image: stockaccount-api:${APP_VERSION:-local}
    command: ["--migrate-only"]
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__Default: Server=mssql,1433;Database=StockAccountDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required};TrustServerCertificate=True;Application Name=StockAccount.Migrator;Connect Timeout=15
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required - run scripts/deploy/new-secrets.ps1}
      Cache__Enabled: "false"
      Reconciliation__Enabled: "false"
      Database__MigrateOnStartup: "true"
      Database__Seed: "false"
      # SIMPLE: no log backups are scheduled (log would grow without bound in FULL). For point-in-time recovery switch to
      # FULL and schedule log backups (see DB_NOTES §8).
      Database__RecoveryModel: SIMPLE
      Database__AppLogin__Name: ${APP_DB_USER:-stockaccount_app}
      Database__AppLogin__Password: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required - run scripts/deploy/new-secrets.ps1}
    depends_on:
      mssql:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/StockAccount.Api/Dockerfile
    image: stockaccount-api:${APP_VERSION:-local}
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      # Runtime uses the least-privilege app login (db_datareader/db_datawriter/EXECUTE), never sa.
      ConnectionStrings__Default: Server=mssql,1433;Database=StockAccountDb;User Id=${APP_DB_USER:-stockaccount_app};Password=${APP_DB_PASSWORD:?APP_DB_PASSWORD is required};Encrypt=True;TrustServerCertificate=True;Application Name=StockAccount.Api;Max Pool Size=100;Min Pool Size=10;Connect Timeout=15;ConnectRetryCount=3;ConnectRetryInterval=10;MultipleActiveResultSets=False
      ConnectionStrings__Redis: redis:6379,abortConnect=false,connectTimeout=1000,syncTimeout=1000,asyncTimeout=1000
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required - run scripts/deploy/new-secrets.ps1}
      APP_VERSION: ${APP_VERSION:-local}
      Database__MigrateOnStartup: "false"
      Database__VerifySchemaOnStartup: "true"
      Database__Seed: "true"
      # Only the two UI proxy containers may set X-Forwarded-For; everyone else is rate limited by its TCP peer IP.
      ForwardedHeaders__KnownProxies__0: 172.30.0.10
      ForwardedHeaders__KnownProxies__1: 172.30.0.11
      ForwardedHeaders__ForwardLimit: "1"
    ports:
      - "${API_BIND:-127.0.0.1}:5080:8080"
    networks: [default, backend]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The aspnet image has no curl/wget: plain HTTP over bash /dev/tcp against the dependency-free liveness endpoint.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  ui-vue:
    build:
      context: ./ui-vue
    image: stockaccount-ui-vue:${APP_VERSION:-local}
    ports:
      - "5173:80"
    networks:
      default:
        ipv4_address: 172.30.0.10
    depends_on:
      - api
    restart: unless-stopped

  ui-nuxt:
    build:
      context: ./ui-nuxt
    image: stockaccount-ui-nuxt:${APP_VERSION:-local}
    environment:
      NUXT_API_BASE: http://api:8080
    ports:
      - "3000:3000"
    networks:
      default:
        ipv4_address: 172.30.0.11
    depends_on:
      - api
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
          ip_range: 172.30.0.128/25   # dynamic addresses; .10/.11 are reserved for the UI proxies
  backend: {}

volumes:
  mssql-data:
