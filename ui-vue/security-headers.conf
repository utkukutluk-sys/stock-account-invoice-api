# Security headers for the SPA (included in every location that sets its own add_header,
# because nginx does not inherit add_header into such locations).
# CSP: scripts only from self (Vite emits no inline scripts); PrimeVue styled mode injects <style>
# elements at runtime, hence style-src 'unsafe-inline'; primeicons font + data: images are local.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
