# Client-IP chain in production: client -> caddy -> this nginx -> api. Only the proxy at TRUSTED_PROXY_IP (caddy, fixed IP
# on the compose network; substituted at container start, see Dockerfile) may tell us the client address through
# X-Forwarded-For. Anyone else (direct hits, the api, other containers) is NOT trusted: their header is ignored and the
# TCP peer address stays $remote_addr. The api in turn trusts only this nginx (ForwardedHeaders__KnownProxies).
map $realip_remote_addr $fwd_proto {
    default $scheme;
    "${TRUSTED_PROXY_IP}" $http_x_forwarded_proto;
}

server {
    listen 80;
    set_real_ip_from ${TRUSTED_PROXY_IP};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/problem+json image/svg+xml;

    # Docker DNS; resolving at request time lets nginx start before the api container is reachable.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Same-origin API proxy (CONTRACT §8.1). The /api prefix is kept: /api/x -> http://api:8080/api/x
    # The client IP is appended to X-Forwarded-For (the API partitions its rate limits by it).
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace (never append to) whatever the caller sent: $remote_addr is the verified client address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Uptime monitoring (public, no secrets): API readiness (SQL Server + Redis) exposed as /api/health/ready.
    location = /api/health/ready {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Swagger is never served by the UI host (the API has it disabled in Production; without this rule the SPA fallback
    # would answer 200 + index.html for /swagger/... which looks like an exposed Swagger to scanners).
    location ^~ /swagger {
        default_type text/plain;
        return 404 "Not Found";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Hashed build assets are immutable.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA history fallback; index.html (and anything not hashed) must always be revalidated.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
